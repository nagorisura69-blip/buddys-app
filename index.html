<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Buddy's App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fa;--surf:#fff;--surf2:#eceef6;--txt:#171a2c;--mut:#6c7491;--line:#e4e7f1;--pri:#ff4f86;--pri2:#ff8a5c;--ok:#12c79a;--them:#fff;--chatbg:#e9ecf6;--me:linear-gradient(135deg,#ff8a5c,#ff4f86);--sh:0 2px 12px rgba(40,50,100,.08);--ov:rgba(10,12,25,.55)}
:root[data-theme=dark]{--bg:#0d0f16;--surf:#161923;--surf2:#1e2230;--txt:#f1f3fb;--mut:#8991ac;--line:#252a3a;--them:#212636;--chatbg:#0d0f16;--sh:none;--ov:rgba(0,0,0,.65)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
.hidden{display:none!important}
svg{flex:none;display:block}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surf);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.3px}
.brand span{background:var(--me);-webkit-background-clip:text;background-clip:text;color:transparent}
.topr{display:flex;align-items:center;gap:4px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--txt)}
.ib:active{background:var(--surf2)}
.body{flex:1;overflow-y:auto;padding:8px 0 14px;-webkit-overflow-scrolling:touch}
.nav{display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--mut);position:relative}
.nav button.on{color:var(--pri)}
.nav .pill{position:absolute;top:3px;left:calc(50% + 6px);background:var(--pri);color:#fff;border-radius:9px;min-width:17px;height:17px;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.av{border-radius:50%;background:linear-gradient(135deg,#ff8a5c,#ff4f86);display:grid;place-items:center;font-weight:800;color:#fff;position:relative;flex:none;overflow:visible}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av .od{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2.5px solid var(--surf)}
.item{display:flex;align-items:center;gap:13px;padding:10px 16px;width:100%;text-align:left}
.item:active{background:var(--surf2)}
.mid{flex:1;min-width:0}
.mid b{display:block;font-size:16px;font-weight:700}
.mid small{display:flex;align-items:center;gap:4px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;margin-top:2px}
.mid small.ty{color:var(--ok);font-weight:700}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11.5px;color:var(--mut)}
.badge{background:var(--pri);color:#fff;border-radius:11px;min-width:21px;height:21px;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px}
.empty{text-align:center;color:var(--mut);padding:60px 30px;line-height:1.6}
.empty .em{font-size:52px;margin-bottom:6px}
.sec{color:var(--mut);font-size:12.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;margin:16px 18px 6px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;margin:8px 14px;box-shadow:var(--sh)}
.btn{background:var(--me);color:#fff;padding:12px 22px;border-radius:26px;font-weight:800;box-shadow:0 6px 16px rgba(255,79,134,.28)}
.btn.alt{background:var(--surf2);color:var(--txt);box-shadow:none}
.btn.sm{padding:8px 15px;font-size:13.5px;border-radius:18px}
.btn.ok{background:linear-gradient(135deg,#12c79a,#3ee6b8);box-shadow:none}
.btn.no{background:#ffe3ea;color:#d6305f;box-shadow:none}
:root[data-theme=dark] .btn.no{background:#3a2030;color:#ff8fae}
.row2{display:flex;gap:10px;margin-top:12px}.row2>*{flex:1}
.inp{width:100%;background:var(--surf2);border-radius:14px;padding:12px 14px}
.search{margin:6px 14px 8px;display:flex;align-items:center;gap:9px;background:var(--surf2);border-radius:22px;padding:0 14px;color:var(--mut)}
.search input{flex:1;padding:11px 0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px;background:radial-gradient(circle at 15% 8%,rgba(255,138,92,.28) 0,transparent 42%),radial-gradient(circle at 90% 92%,rgba(255,79,134,.25) 0,transparent 45%),var(--bg)}
.center h1{font-size:34px;font-weight:800;letter-spacing:-.5px}
.center p{color:var(--mut);max-width:290px;line-height:1.5}
.gbtn{display:flex;align-items:center;gap:12px;background:#fff;color:#222;font-weight:800;padding:14px 24px;border-radius:30px;margin-top:8px;box-shadow:0 8px 26px rgba(30,40,90,.18)}
.note{font-size:13px;color:var(--mut)}
/* chat */
.chead{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 2px;background:var(--surf);border-bottom:1px solid var(--line)}
.chp{flex:1;display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.who{min-width:0}.who b{display:block;font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:12.5px;color:var(--mut);height:16px}.who small.on{color:var(--ok);font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:8px 10px 10px;background-color:var(--chatbg);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mrow{display:flex;flex-direction:column}
.mrow.hl .bub{outline:3px solid var(--acc,#ffc93c);outline-offset:2px}
.dayhdr{align-self:center;background:var(--surf);color:var(--mut);font-size:12px;font-weight:700;padding:4px 13px;border-radius:12px;margin:12px 0 8px;box-shadow:var(--sh)}
.line{display:flex;margin:1.5px 0;position:relative}.line.me{justify-content:flex-end}
.bub{max-width:82%;padding:7px 10px 4px;border-radius:17px;background:var(--them);box-shadow:0 1px 2px rgba(20,30,70,.1);position:relative;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s}
.me .bub{background:var(--me);color:#fff;border-bottom-right-radius:5px}
.line:not(.me) .bub{border-bottom-left-radius:5px}
.bub.nobg{background:none;box-shadow:none;padding:2px 4px}.me .bub.nobg{color:inherit}
.bub.del{opacity:.75;font-size:14px}
.t{font-size:16px;line-height:1.38;white-space:pre-wrap}.t a{color:inherit;text-decoration:underline}
.big{font-size:44px;line-height:1.1}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:10.5px;opacity:.72;margin-top:1px}
.tk{display:inline-flex;align-items:center}.tk.r{color:#8ef4ff;opacity:1}
.me .meta{color:#fff}
.med{display:block;max-width:100%;width:230px;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:3px;background:rgba(0,0,0,.12);min-height:110px}
.vwrap{position:relative;width:230px;max-width:100%}.vwrap video{width:100%;max-height:300px;object-fit:cover;border-radius:12px;background:#000;display:block;min-height:120px}
.vwrap .pl{position:absolute;inset:0;display:grid;place-items:center}.vwrap .pl i{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff}
.cap{margin:3px 2px 2px;font-size:15px}
.once{display:flex;align-items:center;gap:9px;padding:10px 6px;font-weight:700;font-size:14.5px}
.once .oc{width:30px;height:30px;border-radius:50%;border:2px dashed currentColor;display:grid;place-items:center;font-size:13px}
.once.done{opacity:.6}
.vp{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0}
.vpb{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;flex:none}
.line:not(.me) .vpb{background:var(--surf2)}
.vpt{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}.line:not(.me) .vpt{background:var(--surf2)}
.vpt i{display:block;height:100%;width:0;background:currentColor;border-radius:3px}
.vpd{font-size:12px;min-width:32px;opacity:.85}
.stk{width:150px;border-radius:22px;padding:14px 10px 12px;text-align:center;color:#fff}
.stk .se{display:block;font-size:64px;line-height:1.1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}.stk b{font-weight:800;font-size:17px;display:block;margin-top:2px;letter-spacing:.2px}
.s-a{background:linear-gradient(135deg,#ff9a8b,#ff4f86)}.s-b{background:linear-gradient(135deg,#7f7fff,#45c4ff)}.s-c{background:linear-gradient(135deg,#ffb347,#ff7a45)}.s-d{background:linear-gradient(135deg,#12c79a,#6be8a3)}.s-e{background:linear-gradient(135deg,#a56cff,#ff7ad9)}.s-f{background:linear-gradient(135deg,#f6d365,#fda085)}
.rq{border-left:4px solid var(--pri);background:rgba(0,0,0,.07);border-radius:9px;padding:5px 9px;margin-bottom:5px;font-size:13px;max-width:100%}
.me .rq{border-left-color:#fff;background:rgba(255,255,255,.2)}
.rq b{display:block;font-size:12.5px}.rq span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.rx{display:flex;gap:4px;margin:-6px 8px 4px;flex-wrap:wrap}.line.me+.rx{justify-content:flex-end}
.rxc{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:1px 7px;font-size:13px;box-shadow:var(--sh)}
.rxc.mine{border-color:var(--pri);background:rgba(255,79,134,.12)}
.comp{display:flex;align-items:flex-end;gap:8px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:var(--chatbg)}
.cin{flex:1;display:flex;align-items:flex-end;background:var(--surf);border-radius:24px;box-shadow:var(--sh);min-width:0}
.cin textarea{flex:1;padding:12px 2px;max-height:110px;resize:none;line-height:1.3;min-width:0}
.cin .ib{width:40px;height:44px;border-radius:0;color:var(--mut)}
.fab{width:46px;height:46px;border-radius:50%;background:var(--me);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 5px 14px rgba(255,79,134,.35)}
.rbar{display:flex;align-items:center;gap:10px;background:var(--surf);padding:8px 14px;border-top:1px solid var(--line)}
.rbar .rq{flex:1;margin:0;background:var(--surf2)}
.recbar{display:flex;align-items:center;gap:10px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:var(--surf)}
.rdot{width:11px;height:11px;border-radius:50%;background:#ff3b5c;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.wave{flex:1;display:flex;align-items:center;gap:3px;height:30px}.wave i{width:3px;border-radius:2px;background:var(--pri);animation:wv 1s infinite ease-in-out}
@keyframes wv{0%,100%{height:5px}50%{height:24px}}
.blockbar{padding:14px;text-align:center;background:var(--surf);color:var(--mut);font-size:14px}
.panel{display:none;background:var(--surf);border-top:1px solid var(--line);height:300px;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.panel.open{display:flex}
.ptabs{display:flex;border-bottom:1px solid var(--line)}.ptabs button{flex:1;padding:10px;font-weight:800;font-size:13.5px;color:var(--mut)}.ptabs button.on{color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri)}
.pbody{flex:1;overflow-y:auto;padding:8px}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}.eg button{font-size:25px;padding:6px 0;border-radius:10px}.eg button:active{background:var(--surf2)}
.egh{font-size:12px;font-weight:800;color:var(--mut);margin:8px 4px 4px;text-transform:uppercase}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg .stk{width:100%;padding:8px 4px;border-radius:16px}.sg .stk .se{font-size:40px}.sg .stk b{font-size:12.5px}
.gg{columns:3;gap:6px}.gg img{width:100%;border-radius:10px;margin-bottom:6px;display:block;background:var(--surf2)}
/* overlays */
.sheetbg{position:fixed;inset:0;background:var(--ov);z-index:50;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surf);border-radius:24px 24px 0 0;padding:10px 10px calc(12px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet:before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px}
.si{display:flex;align-items:center;gap:15px;width:100%;padding:14px 12px;border-radius:14px;font-weight:700;font-size:15.5px;text-align:left}
.si:active{background:var(--surf2)}.si.danger{color:#e5365f}
.rxrow{display:flex;justify-content:space-around;background:var(--surf2);border-radius:30px;padding:4px;margin:2px 4px 8px}
.rxrow button{font-size:27px;width:46px;height:46px;border-radius:50%}.rxrow button:active{background:var(--surf)}
.modal{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;color:#fff}
.viewer img,.viewer video{max-width:100%;max-height:100%;touch-action:pinch-zoom}
.vtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 8px 20px;background:linear-gradient(#000a,transparent);z-index:2}
.vtop .ib{color:#fff}.vtop span{font-weight:700}.vcap{position:absolute;bottom:0;left:0;right:0;padding:30px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000b);text-align:center}
.pv{flex:1;display:flex;align-items:center;justify-content:center;background:#000;min-height:0}.pv img,.pv video{max-width:100%;max-height:100%}
.pvb{display:flex;align-items:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--surf)}.pvb .inp{flex:1}
.once-t{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;padding:8px 12px;border-radius:20px;background:var(--surf2);color:var(--mut)}.once-t.on{background:var(--pri);color:#fff}
.searchov{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.sres{flex:1;overflow-y:auto}.sres .item small{white-space:normal}.sres mark{background:#ffe07a;color:#222;border-radius:3px}
/* status */
.ring{padding:3px;border-radius:50%;background:conic-gradient(#ff8a5c,#ff4f86,#ffc93c,#ff8a5c)}.ring.seen{background:var(--line)}.ring>div{background:var(--surf);padding:2px;border-radius:50%}
.sv{position:fixed;inset:0;z-index:70;background:#111;color:#fff;display:flex;flex-direction:column}
.sv .bars{display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 10px 6px}.sv .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.sv .bars i b{display:block;height:100%;width:0;background:#fff}
.sv .sc{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}.sv .sc img,.sv .sc video{max-width:100%;max-height:100%}
.sv .st{font-size:28px;font-weight:800;text-align:center;padding:30px;line-height:1.3}
.sv .sh{display:flex;align-items:center;gap:10px;padding:4px 12px}.sv .sf{padding:10px 16px calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:14px}
.sv .zl,.sv .zr{position:absolute;top:0;bottom:0;width:35%}.sv .zl{left:0}.sv .zr{right:0}
.swatch{display:flex;gap:8px;padding:10px;overflow-x:auto}.swatch i{width:34px;height:34px;border-radius:50%;flex:none;border:3px solid transparent}.swatch i.on{border-color:#fff}
/* settings */
.set{display:flex;align-items:center;gap:14px;padding:13px 18px;width:100%;text-align:left}.set:active{background:var(--surf2)}
.set .ico{width:38px;height:38px;border-radius:12px;background:var(--surf2);display:grid;place-items:center;color:var(--pri);flex:none}
.set .mid small{white-space:normal}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;z-index:2}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.2s}.sw i:after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:after{transform:translateX(20px)}
.wps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px}.wp{height:120px;border-radius:16px;border:3px solid transparent;display:flex;align-items:flex-end;padding:8px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px #0008;background-size:cover}.wp.sel{border-color:var(--pri)}
.seg{display:flex;background:var(--surf2);border-radius:14px;padding:3px;margin:6px 16px}.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut)}.seg button.on{background:var(--surf);color:var(--txt);box-shadow:var(--sh)}
code.l{display:block;word-break:break-all;background:var(--surf2);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--pri);margin:8px 0}
/* lock */
.lock{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 0,rgba(255,138,92,.35) 0,transparent 55%),var(--bg);display:flex;align-items:center;justify-content:center}
.lockbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;width:100%;max-width:340px}.lockbox h2{font-weight:800}.lockbox p{color:var(--mut);font-size:14px;min-height:20px;text-align:center}
.dots{display:flex;gap:16px;margin:10px 0 16px}.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--mut)}.dots i.on{background:var(--pri);border-color:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px}.pad button{height:74px;border-radius:50%;background:var(--surf);box-shadow:var(--sh);font-size:27px;font-weight:700}.pad button:active{background:var(--pri);color:#fff}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.linkb{color:var(--mut);text-decoration:underline;font-size:14px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:300;font-size:14px;max-width:86%;text-align:center;box-shadow:0 6px 20px #0005}
.ldr{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--surf);padding:6px 12px;border-radius:14px;font-size:12px;color:var(--mut);box-shadow:var(--sh);z-index:5}
</style>
</head>
<body>
<div id="app"></div>
<div id="lock" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script src="config.js"></script>
<script src="push.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const CFG = window.BUDDY_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ls = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const PAGE = 40, EDIT_WINDOW = 15 * 60 * 1000;

const tmFmt = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function dayLabel(iso) {

  if (d.toDateString() === n.toDateString()) return 'Today';
  if (d.toDateString() === new Date(n - 864e5).toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtSeen(iso) {
  const d = new Date(iso), n = new Date(), tm = tmFmt(iso);
  if (d.toDateString() === n.toDateString()) return 'today at ' + tm;
  if (d.toDateString() === new Date(n - 864e5).toDateString()) return 'yesterday at ' + tm;
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' at ' + tm;
}
const fmtDur = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

function presence(p) {

  if (fresh && p.show_online) return { t: 'online', on: true };

  return { t: '', on: false };
}

function sheet(html) {

  const close = () => { rmOv(close); bg.remove(); };

}
function menuSheet(items, head = '', onEmoji) {

/* ---------- app lock ---------- */
const PIN_KEY = 'buddy_pin', FP_KEY = 'buddy_fp';
const hasPin = () => !!ls.get(PIN_KEY, '');
const hasFp = () => !!ls.get(FP_KEY, '');
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('buddy:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function holdLock() { noLock = true; setTimeout(() => noLock = false, 60000); }
async function fpEnable() {
  holdLock();
  try {
    const c = await navigator.credentials.create({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: "Buddy's App" }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: (me && me.email) || 'buddy', displayName: (profile && profile.name) || 'Buddy' }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
    ls.set(FP_KEY, b64(c.rawId)); return true;
  } catch (e) { return false; }
}
async function fpCheck() {
  holdLock();
  try {
    await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(ls.get(FP_KEY, '')), transports: ['internal'] }], userVerification: 'required', timeout: 60000 } });
    return true;
  } catch (e) { return false; }
}
function hideLock() { $('#lock').className = 'hidden'; $('#lock').innerHTML = ''; }
function askPin(title, { sub = '', cancel = false, shake = false, fp = false } = {}) {
  return new Promise(res => {
    const el = $('#lock'); let v = '';
    el.className = 'lock';
    el.innerHTML = `<div class="lockbox ${shake ? 'shake' : ''}"><div style="color:var(--pri)">${ic('lock', 40)}</div><h2>${esc(title)}</h2><p>${esc(sub)}</p><div class="dots"><i></i><i></i><i></i><i></i></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'fp',0,'⌫'].map(k => k === 'fp' ? (fp ? `<button data-k="FP" style="color:var(--pri)">${ic('finger', 30)}</button>` : '<span></span>') : `<button data-k="${k}">${k}</button>`).join('')}</div>${cancel ? '<button class="linkb" id="pcancel">Cancel</button>' : '<button class="linkb" id="pforgot">Forgot PIN? Log out</button>'}</div>`;
    const upd = () => $$('.dots i', el).forEach((d, i) => d.classList.toggle('on', i < v.length));
    el.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.id === 'pcancel') { hideLock(); res(null); return; }
      if (b.id === 'pforgot') { ask('Forgot PIN?', 'You will be logged out and the PIN removed. Sign in again with Google.', 'Log out', () => { ls.del(PIN_KEY); ls.del(FP_KEY); hideLock(); locked = false; logout(); }); return; }
      const k = b.dataset.k;
      if (k === 'FP') { el.onclick = null; res('FP'); return; }
      if (k === '⌫') v = v.slice(0, -1); else if (v.length < 4) v += k;
      upd(); if (v.length === 4) { el.onclick = null; setTimeout(() => res(v), 100); }
    };
  });
}
async function lockNow() {
  const stored = ls.get(PIN_KEY, ''); if (!stored || locked) return;
  locked = true; let err = false, tryFp = hasFp();
  while (true) {
    if (tryFp) { tryFp = false; while (document.hidden) await sleep(150); if (await fpCheck()) break; }
    const p = await askPin('Enter PIN', { sub: err ? 'Wrong PIN, try again' : "Buddy's App is locked", shake: err, fp: hasFp() });
    if (p === 'FP') { if (await fpCheck()) break; continue; }
    if (await sha(p) === stored) break;
    err = true; if (navigator.vibrate) navigator.vibrate(120);
  }
  hideLock(); locked = false;
}
async function setPinFlow() {
  if (hasPin()) { const o = await askPin('Current PIN', { cancel: true }); if (o === null) return; if (await sha(o) !== ls.get(PIN_KEY, '')) { hideLock(); return toast('Wrong PIN'); } }
  const a = await askPin('New PIN', { sub: '4 digits', cancel: true }); if (a === null) return;
  const b = await askPin('Confirm PIN', { cancel: true }); if (b === null) return;
  hideLock(); if (a !== b) return toast("PINs didn't match");
  ls.set(PIN_KEY, await sha(a)); toast('PIN set 🔒'); if (route.v === 'settings') rSettings();
}
async function removePinFlow() {
  const o = await askPin('Enter PIN to remove', { cancel: true }); if (o === null) return; hideLock();
  if (await sha(o) !== ls.get(PIN_KEY, '')) return toast('Wrong PIN');
  ls.del(PIN_KEY); ls.del(FP_KEY); toast('PIN removed'); rSettings();
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); if (me) setOnline(false); if (me && hasPin() && !noLock && !locked) lockNow(); }
  else { noLock = false; if (me) { setOnline(true); if (Date.now() - hiddenAt > 30000) resync(); } }
});

async function logout() { try { await setOnline(false); } catch (e) {} await sb.auth.signOut(); location.href = location.pathname; }
async function getProfile() {
  for (let i = 0; i < 6; i++) { const { data } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle(); if (data) return data; await sleep(800); }
  return null;
}
async function init() {
  const q = new URLSearchParams(location.search).get('invite');
  if (q) ls.set('buddy_invite', q);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (CFG.SUPABASE_KEY.startsWith('PASTE')) return info('🔑', 'Key missing', 'Open config.js and paste your Supabase publishable key.');
  if (hasPin()) await lockNow();
  const { data: { session } } = await sb.auth.getSession();
  if (location.hash.includes('access_token') || location.search.includes('code=') || q) history.replaceState({}, '', location.pathname);
  if (!session) return showLogin();
  me = session.user; boot();
}
async function boot() {
  profile = await getProfile();
  if (!profile) return info('😕', 'Something went wrong', 'Could not load your profile.', [['Try again', () => location.reload()], ['Log out', logout, 'alt']]);
  let claimMsg = '';
  if (profile.status === 'new') {
    const code = ls.get('buddy_invite', '');
    if (code) {
      const { data } = await sb.rpc('claim_invite', { p_code: code }); ls.del('buddy_invite');
      if (data === 'ok' || data === 'owner') profile = await getProfile();
      else if (data === 'used') claimMsg = 'This invite link was already used.';
      else if (data === 'invalid') claimMsg = 'This invite link is not valid.';
    }
  }
  if (profile.status === 'new') return info('🔗', 'Invite needed', claimMsg || "Buddy's App is invite-only. Open the link your buddy sent you.", [['Log out', logout, 'alt']]);
  if (profile.status === 'pending') {
    info('⏳', 'Waiting for approval', 'Your request is sent. You can come in as soon as it is approved.', [['Check again', async () => { const p = await getProfile(); if (p.status !== 'pending') location.reload(); else toast('Still waiting…'); }], ['Log out', logout, 'alt']]);
    setInterval(async () => { const p = await getProfile(); if (p && p.status !== 'pending') location.reload(); }, 5000); return;
  }
  if (profile.status === 'rejected') return info('🚫', 'No access', 'Your request was not approved.', [['Log out', logout, 'alt']]);
  startApp();
}

  { id: 'peach', n: 'Peach', css: 'linear-gradient(160deg,#ffd7c2,#ffc2d6)' },
  { id: 'sky', n: 'Sky', css: 'linear-gradient(160deg,#cfe8ff,#e4d9ff)' },
  { id: 'mint', n: 'Mint', css: 'linear-gradient(160deg,#c9f5e4,#d9f0ff)' },
  { id: 'night', n: 'Night', css: 'linear-gradient(160deg,#1a1440,#3a1c5e)' },
  { id: 'sunset', n: 'Sunset', css: 'linear-gradient(160deg,#3a1c71,#d76d77,#ffaf7b)' },
  { id: 'ocean', n: 'Ocean', css: 'linear-gradient(170deg,#0f2027,#203a43,#2c5364)' }
];
function applyWall(el) {
  const id = ls.get('buddy_wp', 'default');
  if (id === 'custom' && ls.get('buddy_wp_img', '')) { el.style.background = `url(${ls.get('buddy_wp_img', '')}) center/cover`; return; }
  const w = WALLS.find(x => x.id === id) || WALLS[0]; el.style.background = w.css; el.style.backgroundSize = w.size || 'cover';
}
function rWall() {
  const cur = ls.get('buddy_wp', 'default');
  $('#app').onclick = null;
  $('#app').innerHTML = `<div class="top"><button class="ib" id="sb">${ic('back', 24)}</button><b style="font-weight:800;font-size:18px">Wallpaper</b><span style="width:42px"></span></div><div class="body"><button class="set" id="wg"><span class="ico">${ic('image', 20)}</span><div class="mid"><b>Choose from gallery</b><small>Use your own photo as chat wallpaper</small></div></button><div class="wps" id="wps">${WALLS.map(w => `<button class="wp ${cur === w.id ? 'sel' : ''}" data-w="${w.id}" style="background:${w.css};background-size:${w.size || 'cover'}">${w.n}</button>`).join('')}${ls.get('buddy_wp_img', '') ? `<button class="wp ${cur === 'custom' ? 'sel' : ''}" data-w="custom" style="background:url(${ls.get('buddy_wp_img', '')}) center/cover">My photo</button>` : ''}</div></div>`;
  $('#sb').onclick = goBack;
  $('#wps').onclick = e => { const b = e.target.closest('[data-w]'); if (!b) return; ls.set('buddy_wp', b.dataset.w); rWall(); toast('Wallpaper set 🎨'); };
  $('#wg').onclick = () => { holdLock(); const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = async () => { noLock = false; const f = i.files[0]; if (!f) return; const s = await shrink(f, 1100); const r = new FileReader(); r.onload = () => { ls.set('buddy_wp_img', r.result); ls.set('buddy_wp', 'custom'); rWall(); toast('Wallpaper set 🎨'); }; r.readAsDataURL(s); }; i.click(); };
}
function rBlocked() {
  const list = [...blocked].map(id => people.get(id)).filter(Boolean);
  $('#app').onclick = null;
  $('#app').innerHTML = `<div class="top"><button class="ib" id="sb">${ic('back', 24)}</button><b style="font-weight:800;font-size:18px">Blocked buddies</b><span style="width:42px"></span></div><div class="body">${list.length ? list.map(p => `<div class="item">${avatar(p, 48)}<div class="mid"><b>${esc(p.name)}</b></div><button class="btn alt sm" data-ub="${p.id}">Unblock</button></div>`).join('') : '<div class="empty"><div class="em">✅</div>No blocked buddies.</div>'}</div>`;
  $('#sb').onclick = goBack; $('.body').onclick = e => { const b = e.target.closest('[data-ub]'); if (b) unblock(b.dataset.ub); };
}

init();
</script>
<script src="extras.js"></script>
</body>
